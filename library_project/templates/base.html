{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Library Management System{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                📚 My Library
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link text-white" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'book_list' %}">
                            Books
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'profile' %}">
                            Profile
                        </a>
                    </li>

                </ul>

                <form class="d-flex me-3">
                    <input class="form-control me-2" type="search" placeholder="Search books">

                    <button class="btn btn-light">
                        <i class="fas fa-search"></i>
                    </button>
                </form>

                {% if user.is_authenticated %}

                <span class="text-white me-3 fw-bold">
                    👋 {{ user.username }}
                </span>

                <a href="{% url 'logout' %}" class="btn btn-outline-danger">
                    Logout
                </a>

                {% else %}

                <a href="{% url 'login' %}" class="btn btn-outline-light me-2">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-primary">
                    Register
                </a>

                {% endif %}

            </div>

        </div>

    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
