{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>{{ book.title }}</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            My Library
        </a>

        <a href="/books/" class="btn btn-warning">
            Back to Books
        </a>

    </div>

</nav>

<!-- Book Details -->

<div class="container mt-5">

    <div class="row">

        <!-- Book Image -->

        <div class="col-md-4">

            <img src="{{ book.image.url }}"
                 class="img-fluid rounded shadow">

        </div>

        <!-- Book Content -->

        <div class="col-md-8">

            <h1>{{ book.title }}</h1>

            <h4 class="text-muted">
                {{ book.author }}
            </h4>

            <hr>

            <!-- Description -->

            <p>
                {{ book.description }}
            </p>

            <!-- Category -->

            <h5>
                Category:
                {{ book.category.name }}
            </h5>

            <!-- Stock -->

            <h5 class="mt-3">

                Stock Available:
                {{ book.stock }}

            </h5>

            <!-- Availability -->

            {% if book.available %}

            <span class="badge bg-success p-2">
                Available
            </span>

            {% else %}

            <span class="badge bg-danger p-2">
                Not Available
            </span>

            {% endif %}

            <!-- Buttons -->

            <div class="mt-4">

                <button class="btn btn-primary">

                    Issue Book

                </button>

                <button class="btn btn-warning">

                    Reserve Book

                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
