<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center"
         style="height:100vh;">

        <div class="col-md-4">

            <div class="card shadow border-0 p-4">

                <h2 class="text-center mb-4">

                    Register

                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <!-- Username -->

                    <div class="mb-3">

                        <label class="form-label">

                            Username

                        </label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Enter username">

                    </div>

                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">

                            Email

                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter email">

                    </div>

                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input type="password"
                               name="password1"
                               class="form-control"
                               id="password1"
                               placeholder="Enter password">

                    </div>

                    <!-- Confirm Password -->

                    <div class="mb-3">

                        <label class="form-label">

                            Confirm Password

                        </label>

                        <input type="password"
                               name="password2"
                               class="form-control"
                               id="password2"
                               placeholder="Confirm password">

                    </div>
                    <div class="form-check mb-3">

    <input class="form-check-input"
           type="checkbox"
           onclick="showPassword()">

    <label class="form-check-label">

        Show Password

    </label>

</div>

                    <!-- Button -->

                    <button class="btn btn-success w-100">

                        Register

                    </button>

                </form>

                <p class="text-center mt-3">

                    Already have account?

                    <a href="/accounts/login/">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>
<script>

function showPassword(){

    var pass1 =
    document.getElementById("password1");

    var pass2 =
    document.getElementById("password2");

    if(pass1.type === "password"){

        pass1.type = "text";
        pass2.type = "text";

    }
    else{

        pass1.type = "password";
        pass2.type = "password";

    }
}

</script>

</body>

</html>
